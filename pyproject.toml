[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "preflight"
version = "0.1.0"
description = "Desktop pre-deployment validation platform"
requires-python = ">=3.12"
dependencies = ["customtkinter>=5.2.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

